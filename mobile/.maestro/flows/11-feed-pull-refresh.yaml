appId: host.exp.Exponent
---
# Test: Pull-to-refresh on the feed screen
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-in.yaml

# Wait for feed to appear
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000
- takeScreenshot: feed_refresh_01_before_refresh

# Swipe down to trigger pull-to-refresh
- swipe:
    start: "50%,40%"
    end: "50%,80%"
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: feed_refresh_02_during_refresh

# Wait a moment for refresh to complete
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 10000
- takeScreenshot: feed_refresh_03_after_refresh

# Verify feed is still showing sort tabs after refresh
- assertVisible: "Sort by Newest"
- assertVisible: "Sort by Trending"
