appId: host.exp.Exponent
---
# Test: Pull-to-refresh on the feed screen
- runFlow: 00-app-launch.yaml
- assertVisible: "Welcome back"

# Login
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- pressKey: Enter
- waitForAnimationToEnd

# Wait for feed to appear
- extendedWaitUntil:
    visible: "Newest"
    timeout: 15000
- takeScreenshot: feed_refresh_01_before_refresh

# Swipe down to trigger pull-to-refresh
- swipe:
    start: "50%,40%"
    end: "50%,80%"
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: feed_refresh_02_during_refresh

# Wait a moment for refresh to complete
- extendedWaitUntil:
    visible: "Newest"
    timeout: 10000
- takeScreenshot: feed_refresh_03_after_refresh

# Verify feed is still showing sort tabs after refresh
- assertVisible: "Newest"
- assertVisible: "Trending"
