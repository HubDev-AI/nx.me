appId: host.exp.Exponent
---
# Delete-account hard-reset — end-to-end verification:
#   1. Sign up a fresh throwaway user.
#   2. Delete their account from Settings → Danger Zone.
#   3. Sign up again with the same email.
#   4. Onboarding screen must reappear (stale nxme_onboarding_complete
#      must not survive the delete).
#
# Timestamp-suffixed email avoids collisions on repeated CI runs when a
# prior run failed mid-way and left the email taken. The whole point of
# step 3 is that the same email works again after hard-delete — but that
# only matters within a single flow invocation.
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

# Shared timestamp for both signup attempts (house style — see
# 04-signup-success.yaml and 76-signup-all-fields-filled.yaml).
- evalScript: ${output.ts = '' + Date.now()}

# --- Step 1: Sign up a disposable user -------------------------------------
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn: "Sign up"
      - waitForAnimationToEnd
      - assertVisible: "Create your account"

      - tapOn:
          id: "input-username"
      - inputText: "del${output.ts}"
      - tapOn:
          id: "input-display-name"
      - inputText: "Maestro Delete"
      - tapOn:
          id: "input-email"
      - inputText: "maestro-delete-${output.ts}@test.com"

      # Toggle password visibility BEFORE typing so inputText reliably hits
      # the secure-text field.
      - tapOn: "Show password"
      - tapOn:
          id: "input-password"
      - inputText: "Test1234!"

      # Second visibility toggle for confirm-password if offered.
      - runFlow:
          when:
            visible: "Show password"
          commands:
            - tapOn: "Show password"
      - tapOn:
          id: "input-confirm-password"
      - inputText: "Test1234!"

      - pressKey: Enter

      # Verification-email interstitial — tap through to login.
      - extendedWaitUntil:
          visible: "Check your email"
          timeout: 20000
      - tapOn: "I've verified my email"
      - waitForAnimationToEnd

      # Log in as the new user.
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 10000
      - tapOn:
          id: "input-email"
      - inputText: "maestro-delete-${output.ts}@test.com"
      - tapOn: "Show password"
      - tapOn:
          id: "input-password"
      - inputText: "Test1234!"
      - scrollUntilVisible:
          element: "Log in"
          direction: DOWN
          timeout: 5000
      - tapOn: "Log in"
      - waitForAnimationToEnd

      # iOS Keychain "Save Password" — dismiss in both wordings.
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
            - waitForAnimationToEnd

# Onboarding screen for the brand-new user.
- extendedWaitUntil:
    visible: "Upload Your Photo"
    timeout: 20000
- takeScreenshot: delete_00_first_onboarding
- tapOn: "Analyze My Style"
- waitForAnimationToEnd

# --- Step 2: Delete the account -------------------------------------------
# Profile tab (rightmost of 3 visible tabs — same point as 15-login-logout-cycle).
- tapOn:
    point: "83%,96%"
- waitForAnimationToEnd

# 3-dot "More options" header button opens the radial menu.
- tapOn: "More options"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Delete Account"
    direction: DOWN
    timeout: 5000
- tapOn: "Delete Account"

# Confirmation Alert:
#   "Your photos, glow-ups, and account data will be permanently deleted.
#    Your username will be reserved for 180 days. This cannot be undone."
# The destructive button is labelled just "Delete".
- tapOn: "Delete"

# DeleteAccountOverlay is shown while the request is in flight. Allow for
# the full DELETE_ACCOUNT_TIMEOUT_MS (45s) before giving up.
- extendedWaitUntil:
    visible: "Sign in or create an account"
    timeout: 45000
- takeScreenshot: delete_01_back_on_login

# --- Step 3: Re-sign-up with the same email -------------------------------
- tapOn: "Sign up"
- waitForAnimationToEnd
- assertVisible: "Create your account"

# Prior username reserved for 180 days — bump the suffix so the reservation
# check doesn't reject us. Email is re-usable because hard-delete dropped
# the auth row.
- tapOn:
    id: "input-username"
- inputText: "del${output.ts}b"
- tapOn:
    id: "input-display-name"
- inputText: "Maestro Delete 2"
- tapOn:
    id: "input-email"
- inputText: "maestro-delete-${output.ts}@test.com"

- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- runFlow:
    when:
      visible: "Show password"
    commands:
      - tapOn: "Show password"
- tapOn:
    id: "input-confirm-password"
- inputText: "Test1234!"

- pressKey: Enter

- extendedWaitUntil:
    visible: "Check your email"
    timeout: 20000
- tapOn: "I've verified my email"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 10000
- tapOn:
    id: "input-email"
- inputText: "maestro-delete-${output.ts}@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
    timeout: 5000
- tapOn: "Log in"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd

# --- Step 4: Onboarding MUST reappear -------------------------------------
# The whole reason this flow exists. If the stale nxme_onboarding_complete
# flag survived the delete, the app would jump straight to the feed and
# this assertion would fail.
- extendedWaitUntil:
    visible: "Upload Your Photo"
    timeout: 20000
- takeScreenshot: delete_02_onboarding_visible_after_resignup
