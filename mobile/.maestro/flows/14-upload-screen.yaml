appId: host.exp.Exponent
---
# Test: Navigate to create tab, tap Upload Photo, verify upload screen elements
- runFlow: 00-app-launch.yaml
- assertVisible: "Welcome back"

# Login
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- pressKey: Enter
- waitForAnimationToEnd

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Newest"
    timeout: 15000

# Navigate to Create tab (2nd tab at 50%)
- tapOn:
    point: "50%,97%"
- waitForAnimationToEnd
- takeScreenshot: upload_screen_01_create_tab

# Verify create screen content
- assertVisible: "Create your glow-up"
- assertVisible: "Upload Photo"
- takeScreenshot: upload_screen_02_create_content

# Tap Upload Photo button
- tapOn: "Upload Photo"
- waitForAnimationToEnd
- takeScreenshot: upload_screen_03_upload_screen

# Verify upload screen elements
- runFlow:
    when:
      visible: "Camera"
    commands:
      - assertVisible: "Gallery"
      - takeScreenshot: upload_screen_04_picker_options

# Verify Analyze button is present (should be disabled without a photo)
- runFlow:
    when:
      visible: "Analyze"
    commands:
      - takeScreenshot: upload_screen_05_analyze_button
