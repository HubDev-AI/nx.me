appId: host.exp.Exponent
---
# Test: Navigate to create tab, verify create/upload screen elements
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-in.yaml

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000

# Navigate to Create tab using accessibility label
- tapOn: "Create, tab, 2 of 3"
- waitForAnimationToEnd
- takeScreenshot: upload_screen_01_create_tab

# Verify create screen loaded
- assertVisible: "Create your glow-up"
- takeScreenshot: upload_screen_02_create_content

# Check for Upload Photo button (accessibility label may include icon)
- runFlow:
    when:
      visible: "Upload Photo"
    commands:
      - tapOn: "Upload Photo"
      - waitForAnimationToEnd
      - takeScreenshot: upload_screen_03_upload_screen

# Verify upload screen elements
- runFlow:
    when:
      visible: "Camera"
    commands:
      - assertVisible: "Gallery"
      - takeScreenshot: upload_screen_04_picker_options

# Verify Analyze button
- runFlow:
    when:
      visible: "Analyze"
    commands:
      - takeScreenshot: upload_screen_05_analyze_button

# Navigate back to Home
- tapOn: "Home, tab, 1 of 3"
- waitForAnimationToEnd
