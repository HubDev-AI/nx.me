appId: host.exp.Exponent
---
# Test: Advisor Memories tab — add a Goal via the Goals subtab composer
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-in.yaml

# Wait for feed to be ready
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000
- takeScreenshot: mem_add_01_on_feed

# Navigate to Advisor tab
- tapOn: "Advisor"
- waitForAnimationToEnd
- takeScreenshot: mem_add_02_advisor_landed

# Switch to Memories subtab within Advisor
- tapOn: "Memories tab"
- waitForAnimationToEnd
- takeScreenshot: mem_add_03_memories_tab

# The Memories tab now has Goals / Notes subtabs above the list.
# Default is Goals; tap it explicitly to make the selection deterministic
# and to verify the tablist is tappable.
- tapOn: "Goals"
- waitForAnimationToEnd
- takeScreenshot: mem_add_04_goals_subtab

# Tap the composer by its per-tab accessibility label and type a goal.
# The TextInput's accessibilityLabel comes from TAB_COPY[activeTab].composerA11yLabel.
- tapOn: "Goal content"
- inputText: "I want to improve my streetwear style this spring"
- takeScreenshot: mem_add_05_typed_memory

# Submit via the circular "Add memory" submit button (AdvisorComposer's
# submitAccessibilityLabel). Assert the row appears.
- tapOn: "Add memory"
- waitForAnimationToEnd
- assertVisible: "I want to improve my streetwear style this spring"
- takeScreenshot: mem_add_06_goal_added

# Switch to Notes — draft must be empty (per-tab drafts), composer
# placeholder / a11y label must flip.
- tapOn: "Notes"
- waitForAnimationToEnd
- takeScreenshot: mem_add_07_notes_subtab

- tapOn: "Note content"
- inputText: "I prefer silver over gold"
- takeScreenshot: mem_add_08_typed_note

- tapOn: "Add memory"
- waitForAnimationToEnd
- assertVisible: "I prefer silver over gold"
- takeScreenshot: mem_add_09_note_added
