appId: host.exp.Exponent
---
# Test: Login form validation — empty fields, invalid input
- runFlow: 00-app-launch.yaml
- assertVisible: "Welcome back"

# Test 1: Submit with empty fields
- tapOn: "Log in"
- waitForAnimationToEnd
- assertVisible: "Email is required"
- assertVisible: "Password is required"
- takeScreenshot: login_val_01_empty_fields

# Test 2: Invalid email format
- tapOn:
    id: "input-email"
- inputText: "notanemail"
- tapOn: "Log in"
- waitForAnimationToEnd
- assertVisible: "Enter a valid email address"
- takeScreenshot: login_val_02_invalid_email

# Test 3: Valid email, empty password
- tapOn:
    id: "input-email"
- eraseText: 20
- inputText: "test@test.com"
- tapOn: "Log in"
- waitForAnimationToEnd
- assertVisible: "Password is required"
- takeScreenshot: login_val_03_no_password

# Test 4: Valid credentials but wrong password (API error)
- tapOn:
    id: "input-email"
- eraseText: 20
- inputText: "test@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "wrongpassword123"
- tapOn: "Log in"
- waitForAnimationToEnd
- takeScreenshot: login_val_04_wrong_password
