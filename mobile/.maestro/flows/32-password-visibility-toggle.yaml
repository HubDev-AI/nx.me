appId: host.exp.Exponent
---
# Test: Password visibility toggle on login and signup
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

# Login screen — toggle password visibility
- assertVisible: "Welcome back"
- tapOn:
    id: "input-password"
- inputText: "secret"
- takeScreenshot: pass_toggle_01_hidden

# Show password
- tapOn: "Show password"
- waitForAnimationToEnd
- takeScreenshot: pass_toggle_02_shown

# Hide password again
- tapOn: "Hide password"
- waitForAnimationToEnd
- takeScreenshot: pass_toggle_03_hidden_again

# Navigate to signup and test there too
- tapOn: "Sign up"
- waitForAnimationToEnd
- assertVisible: "Create your account"

# Toggle first password field
- scrollUntilVisible:
    element: "Password"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "input-password"
- inputText: "test"
- takeScreenshot: pass_toggle_04_signup_hidden
