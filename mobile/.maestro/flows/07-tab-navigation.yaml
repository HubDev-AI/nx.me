appId: host.exp.Exponent
---
# Test: Tab bar navigation between all screens
# Prerequisite: User must be logged in

- takeScreenshot: tabs_01_initial

# Navigate to Create tab
- tapOn:
    point: "50%,96%"
- waitForAnimationToEnd
- takeScreenshot: tabs_02_create_tab

# Navigate to Profile tab
- tapOn:
    point: "83%,96%"
- waitForAnimationToEnd
- takeScreenshot: tabs_03_profile_tab

# Navigate back to Home tab
- tapOn:
    point: "17%,96%"
- waitForAnimationToEnd
- takeScreenshot: tabs_04_home_tab
