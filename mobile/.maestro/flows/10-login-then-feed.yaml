appId: host.exp.Exponent
---
# Test: Login with valid credentials and verify feed with all 3 sort tabs
- runFlow: 00-app-launch.yaml
- assertVisible: "Welcome back"

# Login
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- pressKey: Enter
- waitForAnimationToEnd

# Wait for feed to load (skeleton or content)
- extendedWaitUntil:
    visible: "Newest"
    timeout: 15000
- takeScreenshot: login_feed_01_landed_on_feed

# Verify all 3 sort tabs are visible
- assertVisible: "Newest"
- assertVisible: "Trending"
- assertVisible: "Top"
- takeScreenshot: login_feed_02_all_tabs_visible

# Tap Trending tab
- tapOn: "Trending"
- waitForAnimationToEnd
- takeScreenshot: login_feed_03_trending_active

# Tap Top tab
- tapOn: "Top"
- waitForAnimationToEnd
- takeScreenshot: login_feed_04_top_active

# Tap Newest tab to return to default
- tapOn: "Newest"
- waitForAnimationToEnd
- takeScreenshot: login_feed_05_newest_active
