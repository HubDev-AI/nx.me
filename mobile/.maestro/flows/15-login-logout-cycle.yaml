appId: host.exp.Exponent
---
# Test: Full login → feed → profile → logout → back to login cycle
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-in.yaml

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000
- takeScreenshot: logout_cycle_01_on_feed

# Navigate to Profile tab (rightmost)
- tapOn:
    point: "83%,96%"
- waitForAnimationToEnd
- takeScreenshot: logout_cycle_02_profile_loaded

# Scroll to find Log out button and tap it
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
    timeout: 10000
- takeScreenshot: logout_cycle_03_logout_visible
- tapOn: "Log out"
- waitForAnimationToEnd

# Verify we're back on login screen
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 10000
- assertVisible: "Welcome back"
- takeScreenshot: logout_cycle_04_back_on_login
