appId: host.exp.Exponent
---
# Test: Login, verify on feed, navigate to profile, look for logout/settings
- runFlow: 00-app-launch.yaml
- assertVisible: "Welcome back"

# Login
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- pressKey: Enter
- waitForAnimationToEnd

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Newest"
    timeout: 15000
- takeScreenshot: logout_cycle_01_on_feed

# Navigate to Profile tab
- tapOn:
    point: "75%,97%"
- waitForAnimationToEnd
- takeScreenshot: logout_cycle_02_profile_loaded

# Look for settings or logout option
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd
      - takeScreenshot: logout_cycle_03_settings_screen

# Check for a Log out or Sign out button
- runFlow:
    when:
      visible: "Log out"
    commands:
      - takeScreenshot: logout_cycle_04_logout_button_found
      - tapOn: "Log out"
      - waitForAnimationToEnd
      - takeScreenshot: logout_cycle_05_after_logout

- runFlow:
    when:
      visible: "Sign out"
    commands:
      - takeScreenshot: logout_cycle_04_signout_button_found
      - tapOn: "Sign out"
      - waitForAnimationToEnd
      - takeScreenshot: logout_cycle_05_after_signout

# If we ended up back on login, verify it
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - assertVisible: "Welcome back"
      - takeScreenshot: logout_cycle_06_back_on_login
