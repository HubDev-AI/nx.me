appId: host.exp.Exponent
---
# Test: Signup — confirm password mismatch shows error
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

- assertVisible: "Welcome back"

# Navigate to signup
- tapOn: "Sign up"
- waitForAnimationToEnd
- assertVisible: "Create your account"
- takeScreenshot: pw_mismatch_01_signup_screen

# Fill all fields correctly
- tapOn:
    id: "input-username"
- inputText: "testmismatch"

- tapOn:
    id: "input-display-name"
- inputText: "Test User"

- tapOn:
    id: "input-email"
- inputText: "mismatch@test.com"

# Toggle password visibility for reliable input
- tapOn: "Show password"

- tapOn:
    id: "input-password"
- waitForAnimationToEnd
- inputText: "ValidPass1234"
- takeScreenshot: pw_mismatch_02_fields_filled

# Enter a DIFFERENT confirm password
- scrollUntilVisible:
    element: "Confirm password"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "input-confirm-password"
- waitForAnimationToEnd
- inputText: "WrongPass5678"
- takeScreenshot: pw_mismatch_03_mismatch_entered

# Submit the form
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd

# Verify we're still on signup (form didn't submit with mismatched passwords)
- assertVisible: "Create your account"
- takeScreenshot: pw_mismatch_04_stayed_on_form
