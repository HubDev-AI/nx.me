appId: host.exp.Exponent
---
# Test: Login with wrong password shows proper error, then correct login works
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml
- assertVisible: "Welcome back"

# Enter wrong password
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- waitForAnimationToEnd
- inputText: "WrongPassword999"
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
    timeout: 5000
- tapOn: "Log in"
- waitForAnimationToEnd

# Should show error message
- extendedWaitUntil:
    visible: "Invalid email or password"
    timeout: 10000
- takeScreenshot: wrong_creds_01_error_shown

# Clear and enter correct password
- tapOn:
    id: "input-password"
- eraseText: 30
- inputText: "TestPass1234"
- tapOn: "Log in"
- waitForAnimationToEnd

# Dismiss save password dialog
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd

# Should succeed
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000
- takeScreenshot: wrong_creds_02_success_after_retry
