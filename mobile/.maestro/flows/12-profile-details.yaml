appId: host.exp.Exponent
---
# Test: Navigate to profile tab, verify user details, try edit profile
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-in.yaml

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000

# Navigate to Profile tab (3rd tab at 75%)
- tapOn:
    point: "83%,96%"
- waitForAnimationToEnd
- takeScreenshot: profile_details_01_loaded

# Verify the @ username is visible
- runFlow:
    when:
      visible: "@"
    commands:
      - takeScreenshot: profile_details_02_username_visible

# Verify stats section (Posts / Reactions)
- runFlow:
    when:
      visible: "Posts"
    commands:
      - assertVisible: "Reactions"
      - takeScreenshot: profile_details_03_stats_visible

# Verify and tap Edit Profile button
- runFlow:
    when:
      visible: "Edit Profile"
    commands:
      - takeScreenshot: profile_details_04_before_edit
      - tapOn: "Edit Profile"
      - waitForAnimationToEnd
      - takeScreenshot: profile_details_05_edit_sheet_open
