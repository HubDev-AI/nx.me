appId: host.exp.Exponent
---
# Test: Feed screen with empty feed (new user, no posts)
# Prerequisite: User must be logged in

# Just take a screenshot of current state
- takeScreenshot: feed_01_current_state

# Check sort tabs are visible
- runFlow:
    when:
      visible: "Sort by Newest"
    commands:
      - assertVisible: "Sort by Newest"
      - assertVisible: "Sort by Trending"

# Test sort tab switching
- runFlow:
    when:
      visible: "Sort by Trending"
    commands:
      - tapOn: "Sort by Trending"
      - waitForAnimationToEnd
      - takeScreenshot: feed_02_trending_tab

- runFlow:
    when:
      visible: "Sort by Newest"
    commands:
      - tapOn: "Sort by Newest"
      - waitForAnimationToEnd
      - takeScreenshot: feed_03_newest_tab
