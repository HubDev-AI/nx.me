appId: host.exp.Exponent
---
# Test: Signup with all fields correctly filled — verify either email verification or duplicate error
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

# Generate unique suffix to avoid collisions
- evalScript: ${output.ts = '' + Date.now()}

- tapOn: "Sign up"
- waitForAnimationToEnd
- assertVisible: "Create your account"

# Fill username with unique value
- tapOn:
    id: "input-username"
- inputText: "maestrotest_${output.ts}"

# Fill display name
- tapOn:
    id: "input-display-name"
- inputText: "Maestro E2E Tester"

# Fill email with unique value
- tapOn:
    id: "input-email"
- inputText: "maestrotest_${output.ts}@test.com"

# Toggle password visibility before typing
- tapOn: "Show password"

# Fill password
- tapOn:
    id: "input-password"
- waitForAnimationToEnd
- inputText: "TestPass1234!"

# Fill confirm password
- scrollUntilVisible:
    element: "Confirm password"
    direction: DOWN
    timeout: 5000
- runFlow:
    when:
      visible: "Show password"
    commands:
      - tapOn: "Show password"
- tapOn:
    id: "input-confirm-password"
- waitForAnimationToEnd
- inputText: "TestPass1234!"

# Submit the form
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: signup_full_01_after_submit

# Verify outcome — either success (email verification) or duplicate error (not a crash)
- runFlow:
    when:
      visible: "Check your email"
    commands:
      - assertVisible: "Open email app"
      - takeScreenshot: signup_full_02_verification_screen

# Handle duplicate email/username scenario
- runFlow:
    when:
      visible: "already"
    commands:
      - takeScreenshot: signup_full_02_duplicate_error

# Handle any other error gracefully
- runFlow:
    when:
      visible: "Create your account"
    commands:
      - takeScreenshot: signup_full_02_still_on_form
