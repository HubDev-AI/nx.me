appId: host.exp.Exponent
---
# Test: Signup form validation — all edge cases
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

# Only run validation if on login screen
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      # Navigate to signup
      - tapOn: "Sign up"
      - waitForAnimationToEnd
      - assertVisible: "Create your account"

      # Test 1: Submit with all empty fields
      - tapOn: "Create account"
      - waitForAnimationToEnd
      - assertVisible: "Username is required"
      - assertVisible: "Display name is required"
      - assertVisible: "Email is required"
      - takeScreenshot: signup_val_01_all_empty

      # Test 2: Fill only username (too short)
      - tapOn:
          id: "input-username"
      - inputText: "ab"
      - tapOn: "Create account"
      - waitForAnimationToEnd
      - takeScreenshot: signup_val_02_username_short

      # Test 3: Password too short
      - tapOn:
          id: "input-username"
      - eraseText: 30
      - inputText: "validuser"
      - tapOn:
          id: "input-display-name"
      - inputText: "Test"
      - tapOn:
          id: "input-email"
      - inputText: "test@test.com"
      - tapOn: "Show password"
      - tapOn:
          id: "input-password"
      - inputText: "short"
      - tapOn: "Create account"
      - waitForAnimationToEnd
      - takeScreenshot: signup_val_03_password_short

      # Test 4: Passwords don't match
      - tapOn:
          id: "input-password"
      - eraseText: 30
      - inputText: "Test1234!"
      - tapOn:
          text: "Show password"
          index: 0
      - tapOn:
          id: "input-confirm-password"
      - inputText: "Different1!"
      - pressKey: Enter
      - waitForAnimationToEnd
      - takeScreenshot: signup_val_04_password_mismatch
