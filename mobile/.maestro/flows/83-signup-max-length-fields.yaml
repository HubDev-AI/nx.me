appId: host.exp.Exponent
---
# Test: Signup form — max length / overflow input in all fields
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

# Navigate to signup
- assertVisible: "Welcome back"
- scrollUntilVisible:
    element: "Sign up"
    direction: DOWN
    timeout: 5000
- tapOn: "Sign up"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 10000
- takeScreenshot: maxlen_01_on_signup

# Type 50-char username (over typical 30-char limit)
- tapOn:
    id: "input-username"
- inputText: "abcdefghijklmnopqrstuvwxyz12345678901234567890abcd"
- takeScreenshot: maxlen_02_long_username

# Type 100-char display name
- tapOn:
    id: "input-display-name"
- inputText: "This Is An Extremely Long Display Name That Goes Way Beyond Any Reasonable Limit For Testing Purpose"
- takeScreenshot: maxlen_03_long_display_name

# Type 200-char email
- tapOn:
    id: "input-email"
- inputText: "this.is.a.very.long.email.address.that.exceeds.normal.limits.and.should.be.handled.gracefully.by.the.form.validation.logic.in.the.signup.flow.testing.overflow.handling.for.edge.cases@extremelylong.com"
- takeScreenshot: maxlen_04_long_email

# Toggle password visibility and type password
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "TestPass1234"
- takeScreenshot: maxlen_05_password_filled

# Fill confirm password if present
- runFlow:
    when:
      visible:
        id: "input-confirm-password"
    commands:
      - tapOn:
          id: "input-confirm-password"
      - inputText: "TestPass1234"
      - takeScreenshot: maxlen_06_confirm_filled

# Scroll to verify form handles long input gracefully
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- takeScreenshot: maxlen_07_form_scrolled

# Try submitting to check validation response to long fields
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: maxlen_08_submitted

# Final state — verify no crash
- takeScreenshot: maxlen_09_final
