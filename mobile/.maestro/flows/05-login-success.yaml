appId: host.exp.Exponent
---
# Test: Successful login and landing on home feed
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

# Should be on login screen
- assertVisible: "Welcome back"

# Login with test credentials
- runFlow: 00-login.yaml

# Verify we landed on the home feed with sort tabs
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 5000
- assertVisible: "Sort by Trending"
- assertVisible: "Sort by Top"
- takeScreenshot: login_success_01_on_feed
