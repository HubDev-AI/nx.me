- assertVisible: "Welcome back"

# Login with the account we just created
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"

- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: login_success_01_after_submit
