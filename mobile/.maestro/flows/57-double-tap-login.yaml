appId: host.exp.Exponent
---
# Test: Tap login button then immediately tap again — verify button disables during load
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml
- assertVisible: "Welcome back"

# Fill valid credentials
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- waitForAnimationToEnd
- inputText: "TestPass1234"

# Tap login
- scrollUntilVisible:
    element: "Log in"
    direction: DOWN
    timeout: 5000
- tapOn: "Log in"
- waitForAnimationToEnd

# Dismiss save password if shown
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Save Password"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd

# Should land on feed
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 20000
- takeScreenshot: double_tap_01_success

# Logout and immediately try to login again (rapid auth cycle)
- tapOn:
    point: "83%,96%"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
    timeout: 10000
- tapOn: "Log out"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 10000

# Immediately login again
- runFlow: 00-login.yaml
- takeScreenshot: double_tap_02_rapid_re_login
