appId: host.exp.Exponent
---
# Test: Signup username edge cases — starts-with-number, only underscores, single char, min 3, over max 31
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-out.yaml

- tapOn: "Sign up"
- waitForAnimationToEnd
- assertVisible: "Create your account"

# Fill common fields once (display name, email, passwords)
- tapOn:
    id: "input-display-name"
- inputText: "Edge Case Tester"
- tapOn:
    id: "input-email"
- inputText: "edge_case@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- waitForAnimationToEnd
- inputText: "ValidPass123!"
- scrollUntilVisible:
    element: "Confirm password"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "input-confirm-password"
- waitForAnimationToEnd
- inputText: "ValidPass123!"

# --- Test 1: Username starts with a number ---
- scrollUntilVisible:
    element: "Username"
    direction: UP
    timeout: 5000
- tapOn:
    id: "input-username"
- inputText: "1startswithnumber"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: username_edge_01_starts_with_number

# --- Test 2: Only underscores ---
- scrollUntilVisible:
    element: "Username"
    direction: UP
    timeout: 5000
- tapOn:
    id: "input-username"
- eraseText: 30
- inputText: "___"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: username_edge_02_only_underscores

# --- Test 3: Single character ---
- scrollUntilVisible:
    element: "Username"
    direction: UP
    timeout: 5000
- tapOn:
    id: "input-username"
- eraseText: 30
- inputText: "a"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: username_edge_03_single_char

# --- Test 4: Exact 3 characters (minimum) ---
- scrollUntilVisible:
    element: "Username"
    direction: UP
    timeout: 5000
- tapOn:
    id: "input-username"
- eraseText: 30
- inputText: "abc"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: username_edge_04_exact_min_3

# --- Test 5: 31 characters (over max of 30) ---
- scrollUntilVisible:
    element: "Username"
    direction: UP
    timeout: 5000
- tapOn:
    id: "input-username"
- eraseText: 40
- inputText: "abcdefghijklmnopqrstuvwxyz12345"
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
    timeout: 5000
- tapOn: "Create account"
- waitForAnimationToEnd
- takeScreenshot: username_edge_05_over_max_31
