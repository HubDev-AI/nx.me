appId: host.exp.Exponent
---
# Test: Navigate to advisor tab, verify sub-tabs if Advisor tab exists
# Note: Current app has 3 tabs (Home, Create, Profile) — Advisor may not exist yet
- runFlow: 00-app-launch.yaml
- runFlow: 00-ensure-logged-in.yaml

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Sort by Newest"
    timeout: 15000
- takeScreenshot: advisor_tabs_00_on_feed

# Check if Advisor tab exists in bottom navigation
- runFlow:
    when:
      visible: "Advisor"
    commands:
      - tapOn: "Advisor"
      - waitForAnimationToEnd
      - takeScreenshot: advisor_tabs_01_landed

      # Verify advisor header
      - runFlow:
          when:
            visible: "Ada"
          commands:
            - assertVisible: "Your style advisor"
            - takeScreenshot: advisor_tabs_02_header_visible

      # Verify sub-tabs
      - assertVisible: "Chat"
      - assertVisible: "Nudges"
      - assertVisible: "Memories"
      - takeScreenshot: advisor_tabs_03_all_tabs_visible

# If no Advisor tab, just take a screenshot and pass
- takeScreenshot: advisor_tabs_final_state
