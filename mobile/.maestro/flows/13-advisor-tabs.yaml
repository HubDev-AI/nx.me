appId: host.exp.Exponent
---
# Test: Navigate to advisor tab, verify 3 sub-tabs (Chat, Nudges, Memories)
- runFlow: 00-app-launch.yaml
- assertVisible: "Welcome back"

# Login
- tapOn:
    id: "input-email"
- inputText: "maestro@test.com"
- tapOn: "Show password"
- tapOn:
    id: "input-password"
- inputText: "Test1234!"
- pressKey: Enter
- waitForAnimationToEnd

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Newest"
    timeout: 15000

# Navigate to Advisor tab (4th tab at ~87.5%)
- tapOn:
    point: "90%,97%"
- waitForAnimationToEnd
- takeScreenshot: advisor_tabs_01_landed

# Verify advisor header
- runFlow:
    when:
      visible: "Ada"
    commands:
      - assertVisible: "Your style advisor"
      - takeScreenshot: advisor_tabs_02_header_visible

# Verify all 3 sub-tabs are present
- assertVisible: "Chat"
- assertVisible: "Nudges"
- assertVisible: "Memories"
- takeScreenshot: advisor_tabs_03_all_tabs_visible

# Chat tab should be active by default — tap Nudges
- tapOn: "Nudges"
- waitForAnimationToEnd
- takeScreenshot: advisor_tabs_04_nudges_active

# Tap Memories tab
- tapOn: "Memories"
- waitForAnimationToEnd
- takeScreenshot: advisor_tabs_05_memories_active

# Tap back to Chat tab
- tapOn: "Chat"
- waitForAnimationToEnd
- takeScreenshot: advisor_tabs_06_chat_active
