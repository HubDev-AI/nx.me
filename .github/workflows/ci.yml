name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # Postgres service mapped to 54322 (Supabase local default) so the
      # live-DB tests in tests/test_dispute_lifecycle.py + the new
      # TestLiveDBConcurrency class in tests/test_credit_rpcs_v2.py can
      # connect without patching their hardcoded DSNs.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 54322:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bootstrap Supabase auth schema (CI Postgres only)
        # Migrations 0003/0016 reference `auth.users(id)` for ON DELETE
        # CASCADE FKs, and migrations 0049/0050/0051 call `auth.role()` /
        # `auth.uid()` for RLS-style guards. Real Supabase ships these via
        # GoTrue; CI's bare Postgres needs minimal stubs so the runner
        # doesn't blow up at 0003.
        run: |
          PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              email TEXT,
              created_at TIMESTAMPTZ DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID
              LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS TEXT
              LANGUAGE sql STABLE AS $$ SELECT 'service_role'::text $$;
          SQL
      - name: Apply database migrations
        run: python -m app.migrations.run
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          REDIS_URL: redis://localhost:6379/0
          # Dev-placeholder fingerprint secret — 64 hex chars (32 bytes).
          # Production rotates via SIGNUP_FINGERPRINT_SERVER_SECRET in the
          # env block; CI only needs a non-empty value to satisfy the
          # fail-fast settings validator.
          SIGNUP_FINGERPRINT_SERVER_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SIGNUP_GRANT_MILLI: 300
          WEEKLY_FREE_GRANT_MILLI: 100
          STRIPE_PRICE_CREDITS_PACK_V1: price_ci_test_credits_pack_v1
          STRIPE_PRICE_PRO_V1: price_ci_test_pro_v1
      - run: pytest --tb=short -q
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          REDIS_URL: redis://localhost:6379/0
          SIGNUP_FINGERPRINT_SERVER_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SIGNUP_GRANT_MILLI: 300
          WEEKLY_FREE_GRANT_MILLI: 100
          STRIPE_PRICE_CREDITS_PACK_V1: price_ci_test_credits_pack_v1
          STRIPE_PRICE_PRO_V1: price_ci_test_pro_v1

  card-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx expo lint
      - run: npm test
